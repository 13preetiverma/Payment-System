version: '3.8'

services:
  
  eureka:
    build: ./Eureka-Service-Registry
    container_name: eureka-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  validation:
    build: ./Payment Validation Service/validation
    container_name: validation-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      - processing

  processing:
    build: ./Payment Processing Service/payments
    container_name: processing-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      - paypal-provider
      - mysql

  paypal-provider:
    build: ./Paypal Provider Service/my paypal provider
    container_name: paypal-provider-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"

volumes:
  mysql-data: